name: CloudMeet single-target patch build and publish
on:
  workflow_dispatch:
    inputs:
      base_revision:
        description: Published joint base revision this patch builds on (e.g. 45)
        type: string
        required: true
      target:
        description: Single build target
        type: choice
        options: [gateway, app-web, api, jitsi-mgr, web, prosody, jicofo, jvb, electron, android]
        required: true
      expected_tls_mode:
        description: Approved TLS mode for this batch's user-supplied origin
        type: choice
        options: [private-ca, caddy-public-acme]
        required: true
      expected_origin:
        description: User-supplied HTTP(S) origin for this batch (DNS name or IP)
        type: string
        required: true
      material_commit:
        description: Reviewed full deployment configuration SHA (must equal workflow commit)
        type: string
        required: true
      architecture:
        description: Native target architecture (server targets only)
        type: choice
        options: [amd64, arm64]
        default: amd64
      publish_images:
        description: Approved patch GHCR/Release publication (no deployment)
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: cloudmeet-single-patch-${{ inputs.base_revision }}-${{ inputs.target }}
  cancel-in-progress: false
env:
  VERSION_RECORD: ${{ github.workspace }}/patch-assignment.json
  CLOUDMEET_AUDIT_DIR: ${{ github.workspace }}/client-network-audit
jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    outputs:
      assignment: ${{ steps.record.outputs.assignment }}
      origin_contract: ${{ steps.origin.outputs.contract }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.material_commit }}
          path: deploy
          persist-credentials: false
      - name: Verify reviewed materials
        env:
          MATERIAL_SHA: ${{ inputs.material_commit }}
          EXPECTED_TLS_MODE: ${{ inputs.expected_tls_mode }}
          EXPECTED_ORIGIN: ${{ inputs.expected_origin }}
        run: |
          test "$MATERIAL_SHA" = "$(git -C deploy rev-parse HEAD)"
          test "$MATERIAL_SHA" = "$GITHUB_SHA"
          cd deploy && python3 -B skills/full-build-deploy/tools/tls_contract.py
      - name: Normalize user origin and retain DNS evidence
        id: origin
        env:
          EXPECTED_ORIGIN: ${{ inputs.expected_origin }}
          EXPECTED_TLS_MODE: ${{ inputs.expected_tls_mode }}
        run: |
          python3 -B deploy/skills/full-build-deploy/tools/origin_contract.py --output origin-contract.json
          echo "contract=$(jq -c . origin-contract.json)" >> "$GITHUB_OUTPUT"
      - name: Authenticate read-only to GHCR for base evidence
        if: ${{ !contains(fromJSON('["electron","android","jitsi-mgr"]'), inputs.target) }}
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Check base batch publication evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B deploy/skills/single-build-deploy/tools/patch_release.py check-base --base-revision "${{ inputs.base_revision }}" --target "${{ inputs.target }}"
      - name: Allocate patch identity (read-only numbering; no joint revision consumed)
        id: record
        env:
          MATERIAL_SHA: ${{ inputs.material_commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cd deploy
          python3 -B skills/single-build-deploy/tools/patch_release.py allocate --base-revision "${{ inputs.base_revision }}" --target "${{ inputs.target }}" --output "$VERSION_RECORD"
          echo "assignment=$(jq -c . "$VERSION_RECORD")" >> "$GITHUB_OUTPUT"

  build-server:
    name: Build
    needs: version
    if: ${{ !contains(fromJSON('["electron","android"]'), inputs.target) }}
    permissions:
      contents: read
      actions: read
    env:
      VERSION: ${{ fromJSON(needs.version.outputs.assignment).versions.server_version }}
      BATCH: ${{ fromJSON(needs.version.outputs.assignment).versions.server_tag }}-${{ github.run_id }}-${{ github.run_attempt }}
      ALLOCATION_JSON: ${{ needs.version.outputs.assignment }}
      ORIGIN_CONTRACT_JSON: ${{ needs.version.outputs.origin_contract }}
      TARGET_ARCH: ${{ inputs.architecture }}
    runs-on: ${{ inputs.architecture == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.material_commit }}
          path: deploy
          persist-credentials: false
      - name: Verify exact reviewed deployment materials
        env:
          MATERIAL_COMMIT: ${{ inputs.material_commit }}
        run: |
          test "$MATERIAL_COMMIT" = "$(git -C deploy rev-parse HEAD)"
          printf '%s' "$ALLOCATION_JSON" > "$VERSION_RECORD"
      - name: Build the single target from pinned source
        run: bash deploy/skills/full-build-deploy/scripts/package.sh build "${{ inputs.target }}"
      - name: Retain build network audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: network-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: deploy/skills/full-build-deploy/output/network-audit-*/
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: deploy/skills/full-build-deploy/output/${{ inputs.target }}/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  build-clients:
    name: Build
    needs: version
    if: ${{ contains(fromJSON('["electron","android"]'), inputs.target) }}
    permissions:
      contents: read
      actions: read
    env:
      ALLOCATION_JSON: ${{ needs.version.outputs.assignment }}
      ORIGIN_CONTRACT_JSON: ${{ needs.version.outputs.origin_contract }}
    runs-on: ${{ inputs.target == 'android' && 'ubuntu-24.04' || 'windows-2022' }}
    timeout-minutes: 120
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.0'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        if: inputs.target == 'android'
        with:
          packages: platform-tools
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.material_commit }}
          path: deploy
          persist-credentials: false
      - name: Validate material identity and write batch configuration
        shell: pwsh
        env:
          MATERIAL_SHA: ${{ inputs.material_commit }}
          CLIENT_TARGET: ${{ inputs.target }}
          EXPECTED_TLS_MODE: ${{ inputs.expected_tls_mode }}
          EXPECTED_ORIGIN: ${{ inputs.expected_origin }}
          ORIGIN_CONTRACT_JSON: ${{ needs.version.outputs.origin_contract }}
          ALLOCATION_JSON: ${{ needs.version.outputs.assignment }}
        run: |
          if ($env:MATERIAL_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'Full SHA required' }
          if ($env:CLIENT_TARGET -notin @('electron','android')) { throw 'Unexpected target' }
          if ((git -C deploy rev-parse HEAD) -ne $env:MATERIAL_SHA) { throw 'Material mismatch' }
          if ($env:MATERIAL_SHA -ne $env:GITHUB_SHA) { throw 'Workflow/material mismatch' }
          [IO.File]::WriteAllText((Join-Path $env:GITHUB_WORKSPACE 'patch-assignment.json'), $env:ALLOCATION_JSON)
          $contract = $env:ORIGIN_CONTRACT_JSON | ConvertFrom-Json
          if (!$contract.origin -or !$contract.addresses) { throw 'Normalized origin/DNS evidence is required' }
          if ($contract.origin -ne $env:EXPECTED_ORIGIN -or $contract.tls_mode -ne $env:EXPECTED_TLS_MODE) { throw 'Origin/TLS contract differs from dispatch inputs' }
          $envFile = Join-Path $env:GITHUB_WORKSPACE 'batch-client.env'
          $fixed = Get-Content deploy/skills/full-build-deploy/config/client.env | Where-Object { $_ -match '^\s*[A-Z_]+\s*=' -and $_ -notmatch '^\s*(SITE_DOMAIN|SITE_SCHEME|SITE_PORT|TLS_MODE|CLIENT_CA_FILE)\s*=' }
          $origin = @("SITE_DOMAIN=$($contract.site_domain)", "SITE_SCHEME=$($contract.site_scheme)", "SITE_PORT=$($contract.site_port)")
          $batch = @($origin + $fixed)
          if ($contract.tls_mode -eq 'caddy-public-acme') { $batch += 'TLS_MODE=caddy-public-acme'; $batch = $batch | Where-Object { $_ -notmatch '^\s*CLIENT_CA_FILE\s*=' } }
          else { $batch += 'TLS_MODE=private-ca'; $batch += "CLIENT_CA_FILE=$($contract.client_ca_file)" }
          [IO.File]::WriteAllLines($envFile, $batch, [Text.UTF8Encoding]::new($false))
          $originContractFile = Join-Path $env:GITHUB_WORKSPACE 'batch-origin.json'
          [IO.File]::WriteAllText($originContractFile, ($contract | ConvertTo-Json -Depth 5), [Text.UTF8Encoding]::new($false))
      - name: Read pinned client source commit from the reviewed sources lock
        id: source
        shell: pwsh
        env:
          CLIENT_TARGET: ${{ inputs.target }}
          ALLOCATION_JSON: ${{ needs.version.outputs.assignment }}
        run: |
          $sources = Get-Content deploy/skills/full-build-deploy/sources.json | ConvertFrom-Json
          $commit = $sources.clients.$($env:CLIENT_TARGET).commit
          if ($commit -cnotmatch '^[0-9a-f]{40}$') { throw 'Invalid pinned client commit' }
          $record = $env:ALLOCATION_JSON | ConvertFrom-Json
          if ($record.request.sources.$($env:CLIENT_TARGET) -ne $commit) { throw 'Patch record differs from sources lock' }
          "commit=$commit" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Check out the pinned client source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ inputs.target == 'electron' && 'stevenzxs/jitsi-meet-electron' || 'stevenzxs/jm' }}
          ref: ${{ steps.source.outputs.commit }}
          path: ${{ inputs.target == 'electron' && 'jitsi-meet-electron' || 'jm' }}
          persist-credentials: false
      - name: Assert checkout, sources lock and patch record agree
        shell: pwsh
        env:
          CLIENT_TARGET: ${{ inputs.target }}
          ALLOCATION_JSON: ${{ needs.version.outputs.assignment }}
          EXPECTED: ${{ steps.source.outputs.commit }}
        run: |
          $path = if ($env:CLIENT_TARGET -eq 'electron') { 'jitsi-meet-electron' } else { 'jm' }
          if ((git -C $path rev-parse HEAD) -ne $env:EXPECTED) { throw 'Checkout differs from sources lock' }
          $record = $env:ALLOCATION_JSON | ConvertFrom-Json
          if ($record.request.sources.$($env:CLIENT_TARGET) -ne $env:EXPECTED) { throw 'Patch record differs from checkout' }
      - name: Set up Java and restore Gradle dependency cache
        if: inputs.target == 'android'
        id: java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            jm/android/gradle/wrapper/gradle-wrapper.properties
            jm/android/settings.gradle*
            jm/android/build.gradle*
            jm/android/gradle.properties
            jm/android/gradle/libs.versions.toml
            jm/android/**/gradle.lockfile
            jm/android/**/gradle/dependency-locks/**
            jm/android/**/build.gradle*
      - name: Android signing prerequisite
        if: inputs.target == 'android'
        shell: pwsh
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES_BASE64 }}
        run: |
          if (!$env:KEYSTORE -or !$env:PROPERTIES) { throw 'Approved Android release signing secrets required; debug fallback prohibited' }
          $dir = Join-Path $env:GITHUB_WORKSPACE 'jm/android/keystores'
          New-Item -ItemType Directory -Force $dir | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $dir 'release.keystore'), [Convert]::FromBase64String($env:KEYSTORE))
          [IO.File]::WriteAllBytes((Join-Path $dir 'release.keystore.properties'), [Convert]::FromBase64String($env:PROPERTIES))
          $text = Get-Content -Raw (Join-Path $dir 'release.keystore.properties')
          if ($text -notmatch '(?m)^storeFile=release\.keystore\s*$') { throw 'Unexpected signing file reference' }
      - name: Public CA prerequisite
        shell: pwsh
        run: |
          $ca = 'deploy/skills/full-build-deploy/config/client-ca.crt'
          if (!(Test-Path $ca)) { throw 'Public CA missing' }
          node -e "const fs=require('fs'),c=require('crypto'); const x=new c.X509Certificate(fs.readFileSync('$ca')); if(c.createHash('sha256').update(x.raw).digest('hex')!=='fab880721274fa86d6a23d8f00fb93be471af863bec0fced6b7e99780b5e6fde')throw Error('CA mismatch');"
          if ($LASTEXITCODE) { throw 'CA fingerprint mismatch' }
      - name: Android SDK prerequisites
        if: inputs.target == 'android'
        shell: pwsh
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
          if ($LASTEXITCODE) { throw 'SDK provisioning failed' }
      - name: WiX prerequisite
        if: inputs.target == 'electron'
        shell: pwsh
        run: |
          $tools = Get-ChildItem 'C:/Program Files (x86)' -Filter 'WiX Toolset v3*' -Directory
          $bin = $tools | ForEach-Object { Join-Path $_.FullName 'bin' } | Where-Object { Test-Path (Join-Path $_ 'candle.exe') } | Select-Object -First 1
          if (!$bin) { throw 'Runner lacks approved WiX v3 tools' }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Install locked product dependencies
        shell: pwsh
        run: |
          $project = if ('${{ inputs.target }}' -eq 'android') { 'jm' } else { 'jitsi-meet-electron' }
          Push-Location $project
          npm ci
          if ($LASTEXITCODE) { throw 'npm ci failed' }
          Pop-Location
      - name: Build and verify packages
        timeout-minutes: 35
        shell: pwsh
        run: |
          if ('${{ inputs.target }}' -eq 'android') {
            python deploy/skills/full-build-deploy/tools/maven-route.py --audit client-network-audit/maven-route.jsonl --gradle-command -- node deploy/skills/full-build-deploy/tools/clients/build-clients.cjs --target android --env-file "$env:GITHUB_WORKSPACE/batch-client.env" --origin-contract "$env:GITHUB_WORKSPACE/batch-origin.json" --version-record patch-assignment.json
          } else {
            node deploy/skills/full-build-deploy/tools/clients/build-clients.cjs --target ${{ inputs.target }} --env-file "$env:GITHUB_WORKSPACE/batch-client.env" --origin-contract "$env:GITHUB_WORKSPACE/batch-origin.json" --version-record patch-assignment.json
          }
          if ($LASTEXITCODE) { throw 'Client build or package verification failed; inspect the preceding error' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: client-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: deploy/release/clients/
          if-no-files-found: error
          retention-days: 14
      - name: Retain audit and sanitized build diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: client-network-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: client-network-audit/
          if-no-files-found: warn
          retention-days: 14
      - name: Remove ephemeral signing files
        if: always() && inputs.target == 'android'
        shell: pwsh
        run: |
          Remove-Item -ErrorAction SilentlyContinue jm/android/keystores/release.keystore, jm/android/keystores/release.keystore.properties

  publish-server:
    needs: [version, build-server]
    if: ${{ inputs.publish_images && !contains(fromJSON('["electron","android"]'), inputs.target) }}
    permissions:
      contents: write
      actions: read
      packages: write
    env:
      ALLOCATION_JSON: ${{ needs.version.outputs.assignment }}
    runs-on: ${{ inputs.architecture == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.material_commit }}
          path: deploy
          persist-credentials: false
      - name: Verify reviewed materials
        env:
          MATERIAL_COMMIT: ${{ inputs.material_commit }}
        run: |
          test "$MATERIAL_COMMIT" = "$(git -C deploy rev-parse HEAD)"
          printf '%s' "$ALLOCATION_JSON" > "$VERSION_RECORD"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: image-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: downloads
      - name: Authenticate to GHCR and GitHub releases
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Publish the exact verified patch artifact
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ARCH: ${{ inputs.architecture }}
        run: python3 -B deploy/skills/single-build-deploy/tools/patch_release.py publish --target "${{ inputs.target }}" --input downloads --record "$VERSION_RECORD"
      - name: Remove runner registry session
        if: always()
        run: docker logout ghcr.io
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: patch-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: downloads/patch-publication.json
          if-no-files-found: warn
          retention-days: 14

  publish-clients:
    needs: [version, build-clients]
    if: ${{ inputs.publish_images && contains(fromJSON('["electron","android"]'), inputs.target) }}
    permissions:
      contents: write
      actions: read
    env:
      ALLOCATION_JSON: ${{ needs.version.outputs.assignment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.material_commit }}
          path: deploy
          persist-credentials: false
      - name: Verify reviewed materials
        env:
          MATERIAL_COMMIT: ${{ inputs.material_commit }}
        run: |
          test "$MATERIAL_COMMIT" = "$(git -C deploy rev-parse HEAD)"
          printf '%s' "$ALLOCATION_JSON" > "$VERSION_RECORD"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: client-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: downloads
      - name: Publish the exact verified client patch package
        env:
          GH_TOKEN: ${{ github.token }}
          CLIENT_VERSION: ${{ fromJSON(needs.version.outputs.assignment).versions.client_version }}
        run: |
          directory=$(find downloads -type d -name "$CLIENT_VERSION-*" | head -1)
          test -n "$directory" || { echo 'Delivery bundle not found'; exit 1; }
          test -f "$directory/build-evidence.json"
          python3 -B deploy/skills/single-build-deploy/tools/patch_release.py publish --target "${{ inputs.target }}" --input "$directory" --record "$VERSION_RECORD"
