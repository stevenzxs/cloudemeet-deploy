name: CloudMeet two-client packages
on:
  workflow_dispatch:
    inputs:
      material_commit:
        description: Reviewed full configuration commit SHA
        required: true
        type: string
      targets:
        description: JSON array of approved client targets
        required: true
        default: '["electron","android"]'
        type: string
  workflow_call:
    inputs:
      material_commit:
        type: string
        required: true
      targets:
        type: string
        required: true
      assignment:
        type: string
        required: true
permissions:
  contents: read
env:
  CLOUDMEET_AUDIT_DIR: ${{ github.workspace }}/client-network-audit
concurrency:
  group: cloudmeet-clients-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    permissions:
      contents: read
    uses: ./.github/workflows/revision-allocation.yml
    with:
      material_commit: ${{ inputs.material_commit }}
      scope: ${{ inputs.targets }}
      assignment: ${{ inputs.assignment || '' }}
  package:
    needs: version
    env:
      ALLOCATION_JSON: ${{ needs.version.outputs.assignment }}
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.targets) }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.0'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        if: matrix.target == 'android'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.material_commit }}
          path: deploy
          persist-credentials: false
      - name: Validate material identity
        shell: pwsh
        env:
          MATERIAL_SHA: ${{ inputs.material_commit }}
          CLIENT_TARGET: ${{ matrix.target }}
        run: |
          if ($env:MATERIAL_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'Full SHA required' }
          if ($env:CLIENT_TARGET -notin @('electron','android')) { throw 'Unexpected target' }
          if ((git -C deploy rev-parse HEAD) -ne $env:MATERIAL_SHA) { throw 'Material mismatch' }
          if ($env:MATERIAL_SHA -ne $env:GITHUB_SHA) { throw 'Workflow/material mismatch' }
          [IO.File]::WriteAllText((Join-Path $env:GITHUB_WORKSPACE 'version-assignment.json'), $env:ALLOCATION_JSON)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: stevenzxs/jitsi-meet-electron
          ref: bee7389737ac93b28b2987861166a744c361beb8
          path: jitsi-meet-electron
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: stevenzxs/jm
          ref: 979a058769a085d0e63e68e6019d5753ed14f96b
          path: jm
          persist-credentials: false
      - name: Android signing prerequisite
        if: matrix.target == 'android'
        shell: pwsh
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES_BASE64 }}
        run: |
          if (!$env:KEYSTORE -or !$env:PROPERTIES) { throw 'Approved Android release signing secrets required; debug fallback prohibited' }
          $dir = Join-Path $env:GITHUB_WORKSPACE 'jm/android/keystores'
          New-Item -ItemType Directory -Force $dir | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $dir 'release.keystore'), [Convert]::FromBase64String($env:KEYSTORE))
          [IO.File]::WriteAllBytes((Join-Path $dir 'release.keystore.properties'), [Convert]::FromBase64String($env:PROPERTIES))
          $text = Get-Content -Raw (Join-Path $dir 'release.keystore.properties')
          if ($text -notmatch '(?m)^storeFile=release\.keystore\s*$') { throw 'Unexpected signing file reference' }
      - name: Windows signing prerequisite
        if: matrix.target == 'electron'
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
          CERTIFICATES_READ_TOKEN: ${{ secrets.CERTIFICATES_READ_TOKEN }}
        run: |
          if (!$env:WINDOWS_PFX_BASE64 -or !$env:WINDOWS_PFX_PASSWORD -or !$env:CERTIFICATES_READ_TOKEN) { throw 'Approved Windows signing identity, Secrets and read-only certificate repository access required; unsigned fallback prohibited' }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: matrix.target == 'electron'
        with:
          repository: stevenzxs/cloudmeet-certificates
          ref: f40342b56636bd727499b555dfdf14ef4a562d73
          token: ${{ secrets.CERTIFICATES_READ_TOKEN }}
          path: cloudmeet-certificates
          persist-credentials: false
      - name: Windows signing tools and identity
        if: matrix.target == 'electron'
        shell: pwsh
        run: |
          node -e "require('./deploy/build-tools/clients/signing.cjs').windowsIdentity()"
          if ($LASTEXITCODE) { throw 'Approved Windows public identity missing or invalid' }
          $tool = Get-ChildItem 'C:/Program Files (x86)/Windows Kits/10/bin/*/x64/signtool.exe' | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$tool) { throw 'Windows SignTool missing' }
          "SIGNTOOL_PATH=$($tool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Public CA prerequisite
        shell: pwsh
        run: |
          $ca = 'deploy/config/client-ca.crt'
          if (!(Test-Path $ca)) { throw 'Public CA missing' }
          node -e "const fs=require('fs'),c=require('crypto'); const x=new c.X509Certificate(fs.readFileSync('$ca')); if(c.createHash('sha256').update(x.raw).digest('hex')!=='fab880721274fa86d6a23d8f00fb93be471af863bec0fced6b7e99780b5e6fde')throw Error('CA mismatch');"
          if ($LASTEXITCODE) { throw 'CA fingerprint mismatch' }
      - name: Android SDK prerequisites
        if: matrix.target == 'android'
        shell: pwsh
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
          if ($LASTEXITCODE) { throw 'SDK provisioning failed' }
      - name: WiX prerequisite
        if: matrix.target == 'electron'
        shell: pwsh
        run: |
          $tools = Get-ChildItem 'C:/Program Files (x86)' -Filter 'WiX Toolset v3*' -Directory
          $bin = $tools | ForEach-Object { Join-Path $_.FullName 'bin' } | Where-Object { Test-Path (Join-Path $_ 'candle.exe') } | Select-Object -First 1
          if (!$bin) { throw 'Runner lacks approved WiX v3 tools' }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Install locked product dependencies
        shell: pwsh
        run: |
          $project = if ('${{ matrix.target }}' -eq 'android') { 'jm' } else { 'jitsi-meet-electron' }
          Push-Location $project
          npm ci
          if ($LASTEXITCODE) { throw 'npm ci failed' }
          Pop-Location
      - name: Build and verify packages
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ matrix.target == 'electron' && secrets.WINDOWS_PFX_BASE64 || '' }}
          WINDOWS_PFX_PASSWORD: ${{ matrix.target == 'electron' && secrets.WINDOWS_PFX_PASSWORD || '' }}
        run: |
          node deploy/build-tools/clients/build-clients.cjs --target ${{ matrix.target }} --version-record version-assignment.json --check
          if ($LASTEXITCODE) { throw 'Client prerequisites failed' }
          node deploy/build-tools/clients/build-clients.cjs --target ${{ matrix.target }} --version-record version-assignment.json
          if ($LASTEXITCODE) { throw 'Client package verification failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: client-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: deploy/release/clients/
          if-no-files-found: error
          retention-days: 14
      - name: Retain network audit even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: client-network-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: client-network-audit/
          if-no-files-found: warn
          retention-days: 14
      - name: Remove ephemeral signing files
        if: always() && matrix.target == 'android'
        shell: pwsh
        run: |
          Remove-Item -ErrorAction SilentlyContinue jm/android/keystores/release.keystore, jm/android/keystores/release.keystore.properties
