name: ARM64 seven-service integration

on:
  workflow_dispatch:
  push:
    branches: [ci/arm64-smoke]
    paths:
      - tools/arm64-stack.py
      - tools/arm64-stack-lock.json
      - .github/workflows/arm64-stack.yml
      - tests/test_arm64_stack.py

permissions:
  contents: read
  actions: read

jobs:
  isolated-stack:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Unit-test exact-image and isolated topology gates
        run: python3 -B -m unittest discover -s tests -p test_arm64_stack.py
      - name: Import locked artifacts and verify isolated seven-service stack
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/arm64-stack.py
      - name: Retain sanitized integration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arm64-stack-${{ github.run_id }}
          path: |
            stack-evidence/result.json
            stack-evidence/stack.log
          retention-days: 14
          if-no-files-found: error
