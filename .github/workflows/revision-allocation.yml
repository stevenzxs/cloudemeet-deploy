name: CloudMeet persistent revision allocation
on:
  workflow_call:
    inputs:
      expected_tls_mode:
        type: string
        required: true
      expected_origin:
        type: string
        required: true
      material_commit:
        type: string
        required: true
      scope:
        type: string
        required: true
      assignment:
        type: string
        default: ''
    outputs:
      assignment:
        value: ${{ jobs.allocate.outputs.assignment }}
permissions:
  contents: write
jobs:
  allocate:
    # Ephemeral hosted runner; state lives only on the dedicated ledger branch.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      assignment: ${{ steps.record.outputs.assignment }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify approved TLS contract before any persistent allocation
        env:
          MATERIAL_SHA: ${{ inputs.material_commit }}
          EXPECTED_TLS_MODE: ${{ inputs.expected_tls_mode }}
          EXPECTED_ORIGIN: ${{ inputs.expected_origin }}
        run: |
          test "$MATERIAL_SHA" = "$GITHUB_SHA"
          test "$MATERIAL_SHA" = "$(git rev-parse HEAD)"
          sha256sum -c build-tools/inputs.sha256
          python3 -B -m unittest discover -s build-tools/tests -p 'test_tls_contract.py'
          python3 -B build-tools/tls_contract.py
      - name: Allocate or verify inherited parent record against persistent ledger
        id: record
        env:
          MATERIAL_SHA: ${{ inputs.material_commit }}
          REQUEST_SCOPE: ${{ inputs.scope }}
          INHERITED_ASSIGNMENT: ${{ inputs.assignment }}
          LEDGER_ANCHOR: ${{ vars.CLOUDMEET_LEDGER_ANCHOR }}
          GH_TOKEN: ${{ github.token }}
        run: |
          export LEDGER_AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::${LEDGER_AUTH_HEADER}"
          unset GH_TOKEN
          python3 -B build-tools/allocate-workflow.py
      - name: Verify revision contract after persistent allocation (failure still consumes revision)
        run: python3 -B -m unittest discover -s build-tools/tests -p 'test_revision*.py'
