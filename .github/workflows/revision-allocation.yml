name: CloudMeet persistent revision allocation
on:
  workflow_call:
    inputs:
      expected_tls_mode:
        type: string
        required: true
      expected_origin:
        type: string
        required: true
      material_commit:
        type: string
        required: true
      scope:
        type: string
        required: true
      assignment:
        type: string
        default: ''
    outputs:
      assignment:
        value: ${{ jobs.allocate.outputs.assignment }}
      origin_contract:
        value: ${{ jobs.allocate.outputs.origin_contract }}
permissions:
  contents: read
jobs:
  allocate:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      assignment: ${{ steps.record.outputs.assignment }}
      origin_contract: ${{ steps.origin.outputs.contract }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.material_commit }}
          persist-credentials: false
      - name: Verify reviewed materials before allocation
        env:
          MATERIAL_SHA: ${{ inputs.material_commit }}
          EXPECTED_TLS_MODE: ${{ inputs.expected_tls_mode }}
          EXPECTED_ORIGIN: ${{ inputs.expected_origin }}
        run: |
          test "$MATERIAL_SHA" = "$(git rev-parse HEAD)"
                    python3 -B skills/full-build-deploy/tools/tls_contract.py
      - name: Normalize user origin and retain DNS evidence before revision allocation
        id: origin
        env:
          EXPECTED_ORIGIN: ${{ inputs.expected_origin }}
          EXPECTED_TLS_MODE: ${{ inputs.expected_tls_mode }}
        run: |
          python3 -B skills/full-build-deploy/tools/origin_contract.py --output origin-contract.json
          contract=$(jq -c . origin-contract.json)
          echo "contract=$contract" >> "$GITHUB_OUTPUT"
      - name: Allocate revision in version policy on main
        id: record
        env:
          MATERIAL_SHA: ${{ inputs.material_commit }}
          REQUEST_SCOPE: ${{ inputs.scope }}
          INHERITED_ASSIGNMENT: ${{ inputs.assignment }}
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ORIGIN_CONTRACT: ${{ steps.origin.outputs.contract }}
        run: |
          test "$(python3 -c 'import json;print(json.load(open("origin-contract.json"))["origin"])')" = "$(python3 -c 'import json,os;print(json.loads(os.environ["EXPECTED_ORIGIN_CONTRACT"])["origin"])')"
          export GH_TOKEN
          python3 -B skills/full-build-deploy/tools/allocate-workflow.py
      - name: Verify revision contract after persistent allocation (failure still consumes revision)
        run: python3 -B -m unittest discover -s skills/full-build-deploy/tests -p 'test_revision*.py'
