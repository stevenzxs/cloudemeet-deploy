name: CloudMeet seven services and two clients
on:
  workflow_dispatch:
    inputs:
      expected_tls_mode:
        description: Approved TLS mode assertion (must match fixed config/client.env)
        type: choice
        options: [private-ca, caddy-public-acme]
        required: true
      expected_origin:
        description: Approved complete HTTPS origin (assertion only)
        type: string
        required: true
      material_commit:
        description: Reviewed full deployment configuration SHA (must equal workflow commit)
        type: string
        required: true
      architecture:
        type: choice
        options: [amd64, arm64]
        required: true
      publish_images:
        description: Approved joint GHCR and two-client Release publication (no deployment)
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  version:
    permissions:
      contents: write
    uses: ./.github/workflows/revision-allocation.yml
    with:
      material_commit: ${{ inputs.material_commit }}
      scope: '["server","h5","electron","android"]'
      expected_tls_mode: ${{ inputs.expected_tls_mode }}
      expected_origin: ${{ inputs.expected_origin }}
  server:
    needs: version
    secrets: inherit
    uses: ./.github/workflows/build-package.yml
    permissions:
      contents: write
      actions: read
      packages: write
    with:
      material_commit: ${{ inputs.material_commit }}
      architecture: ${{ inputs.architecture }}
      publish_images: false
      expected_tls_mode: ${{ inputs.expected_tls_mode }}
      expected_origin: ${{ inputs.expected_origin }}
      assignment: ${{ needs.version.outputs.assignment }}
  publish:
    needs: [version, server, clients]
    if: inputs.publish_images
    permissions:
      contents: write
      actions: read
      packages: write
    uses: ./.github/workflows/publish-release.yml
    with:
      expected_tls_mode: ${{ inputs.expected_tls_mode }}
      expected_origin: ${{ inputs.expected_origin }}
      material_commit: ${{ inputs.material_commit }}
      architecture: ${{ inputs.architecture }}
      assignment: ${{ needs.version.outputs.assignment }}
  clients:
    needs: version
    permissions:
      contents: write
    uses: ./.github/workflows/build-clients.yml
    secrets: inherit
    with:
      material_commit: ${{ inputs.material_commit }}
      expected_tls_mode: ${{ inputs.expected_tls_mode }}
      expected_origin: ${{ inputs.expected_origin }}
      targets: '["electron","android"]'
      assignment: ${{ needs.version.outputs.assignment }}
