name: CloudMeet compile and package

on:
  workflow_dispatch:
    inputs:
      material_commit:
        description: 'Reviewed deployment-material commit SHA (must equal workflow commit)'
        required: true
        type: string
      architecture:
        description: 'Native target architecture'
        required: true
        default: arm64
        type: choice
        options: [arm64, amd64]
      publish_images:
        description: 'Explicitly approved GHCR publication of this exact batch (no deployment)'
        required: true
        default: false
        type: boolean

  workflow_call:
    secrets:
      H5_SOURCE_READ_TOKEN:
        required: true
    inputs:
      material_commit:
        type: string
        required: true
      architecture:
        type: string
        required: true
      publish_images:
        type: boolean
        default: false
      assignment:
        type: string
        required: true

permissions:
  contents: read
  actions: read

env:
  TARGET_ARCH: ${{ inputs.architecture || 'arm64' }}
  VERSION_RECORD: ${{ github.workspace }}/version-assignment.json

jobs:
  version:
    permissions:
      contents: read
    uses: ./.github/workflows/revision-allocation.yml
    with:
      material_commit: ${{ inputs.material_commit }}
      scope: '["server"]'
      assignment: ${{ inputs.assignment || '' }}
  build:
    needs: version
    env:
      VERSION: ${{ fromJSON(needs.version.outputs.assignment).versions.server_version }}
      BATCH: ${{ fromJSON(needs.version.outputs.assignment).versions.server_tag }}-${{ github.run_id }}-${{ github.run_attempt }}
      ALLOCATION_JSON: ${{ needs.version.outputs.assignment }}
    runs-on: ${{ inputs.architecture == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, app-web, api, web, prosody, jicofo, jvb]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact reviewed deployment materials
        env:
          MATERIAL_COMMIT: ${{ inputs.material_commit || github.sha }}
        run: |
          test "$MATERIAL_COMMIT" = "$(git rev-parse HEAD)"
          sha256sum -c build-tools/inputs.sha256
          printf '%s' "$ALLOCATION_JSON" > "$VERSION_RECORD"
      - name: Build one service from pinned source and export exact image
        env:
          SERVICE: ${{ matrix.service }}
        run: bash build-tools/package.sh build "$SERVICE"
      - name: Retain build network audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: network-${{ matrix.service }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/network-audit-*/
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-${{ matrix.service }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/${{ matrix.service }}/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [version, build, package]
    env:
      VERSION: ${{ fromJSON(needs.version.outputs.assignment).versions.server_version }}
      BATCH: ${{ fromJSON(needs.version.outputs.assignment).versions.server_tag }}-${{ github.run_id }}-${{ github.run_attempt }}
      ALLOCATION_JSON: ${{ needs.version.outputs.assignment }}
    if: github.event_name == 'workflow_dispatch' && inputs.publish_images
    runs-on: ${{ inputs.architecture == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify reviewed materials
        env:
          MATERIAL_COMMIT: ${{ inputs.material_commit }}
        run: |
          test "$MATERIAL_COMMIT" = "$(git rev-parse HEAD)"
          sha256sum -c build-tools/inputs.sha256
          python3 -B -m unittest discover -s build-tools/tests -p test_publish.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: image-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: downloads
      - name: Authenticate only to GHCR
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Publish exact verified images and registry identities
        run: |
          printf '%s' "$ALLOCATION_JSON" > "$VERSION_RECORD"
          python3 -B build-tools/publish.py
      - name: Remove runner registry session
        if: always()
        run: docker logout ghcr.io
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: registry-${{ github.run_id }}-${{ github.run_attempt }}
          path: publication/
          if-no-files-found: warn
          retention-days: 14

  package:
    needs: [version, build]
    env:
      VERSION: ${{ fromJSON(needs.version.outputs.assignment).versions.server_version }}
      BATCH: ${{ fromJSON(needs.version.outputs.assignment).versions.server_tag }}-${{ github.run_id }}-${{ github.run_attempt }}
      ALLOCATION_JSON: ${{ needs.version.outputs.assignment }}
    runs-on: ${{ inputs.architecture == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact reviewed deployment materials
        env:
          MATERIAL_COMMIT: ${{ inputs.material_commit || github.sha }}
        run: |
          test "$MATERIAL_COMMIT" = "$(git rev-parse HEAD)"
          sha256sum -c build-tools/inputs.sha256
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: image-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: downloads
      - name: Arrange current-run artifacts (no previous batch fallback)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir incoming
          for service in gateway app-web api web prosody jicofo jvb; do
            mv "downloads/image-${service}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "incoming/$service"
          done
          python3 -B - <<'PY'
          import json, os, pathlib, urllib.request
          url = os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'] + '/artifacts?per_page=100'
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=60) as response:
              artifacts = json.load(response)['artifacts']
          records = []
          for service in ('gateway','app-web','api','web','prosody','jicofo','jvb'):
              name = 'image-' + service + '-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT']
              matches = [a for a in artifacts if a['name'] == name and not a['expired']]
              if len(matches) != 1: raise ValueError('Missing or duplicate artifact: ' + name)
              artifact = matches[0]
              records.append({key: artifact.get(key) for key in ('id','name','digest','size_in_bytes','created_at')})
          pathlib.Path('incoming/artifacts.json').write_text(json.dumps(records, indent=2) + '\n')
          PY
      - name: Read immutable H5 source identity
        id: h5
        run: |
          python3 -B - <<'PY' >> "$GITHUB_OUTPUT"
          import json,re
          lock=json.load(open('config/h5-source.json'))
          assert lock['repository']=='stevenzxs/jitsi-weixin'
          assert re.fullmatch('[0-9a-f]{40}',lock['commit'])
          print('commit='+lock['commit'])
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: stevenzxs/jitsi-weixin
          ref: ${{ steps.h5.outputs.commit }}
          path: h5-source
          token: ${{ secrets.H5_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - name: Assemble complete package and check material integrity only
        run: |
          printf '%s' "$ALLOCATION_JSON" > "$VERSION_RECORD"
          bash build-tools/package.sh assemble
      - name: Retain assembly network audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: network-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/network-audit-*/
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cloudmeet-${{ inputs.architecture == 'amd64' && 'amd64' || 'aarch64' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/*.tar.gz
            output/*.sha256
            output/package-evidence.json
            output/setup.py
            output/setup.py.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
